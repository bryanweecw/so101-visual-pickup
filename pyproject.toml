[project]
name = "so101-visual-pickup"
version = "0.1.0"
description = "Wrist RGB neural pickup in MuJoCo, with frozen evaluation evidence"
requires-python = ">=3.14"
dependencies = ["hebbian-rua==0.1.2", "mujoco==4.0.1", "numpy>=2", "scipy==1.18.1", "pillow>=11", "mlx>=0.30", "opencv-python-headless==5.1.0.95"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_mimic"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
